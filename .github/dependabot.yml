version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # 開発用の依存は PR が増えすぎないように 1 本にまとめる
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
